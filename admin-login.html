<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Login - K.D Jewellery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:#1a1a1a;">

    <div style="background:white; padding:40px; border-radius:12px; width:320px; text-align:center;">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:6px;">
        <input type="password" id="password" placeholder="Password" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:6px;">
        <button id="loginBtn" style="width:100%; padding:12px; background:#d4af37; color:white; border:none; border-radius:6px; cursor:pointer;">Login</button>
        <p id="error" style="color:red; margin-top:10px;"></p>
    </div>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        document.getElementById("loginBtn").addEventListener("click", async () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "admin-dashboard.html";
            } catch (error) {
                document.getElementById("error").textContent = "Login failed: " + error.message;
            }
        });
    </script>

</body>
</html>
