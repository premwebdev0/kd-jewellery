<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Product - K.D JEWELLERY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
    <img src="image/logo/logo.jpg" alt="K.D JEWELLERY" class="logo-img">
    K.D JEWELLERY
</div>
        <nav>
            <a href="index.html#home">Home</a>
            <a href="index.html#categories">Categories</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <section id="product-page">

        <a id="back-link" href="#" class="back-link">&larr; Back to Collection</a>

        <div class="product-detail-container">

            <img id="product-image" src="" alt="Product">

            <div class="product-info">
                <h1 id="product-name"></h1>
                <p><strong>Metal:</strong> <span id="product-metal"></span></p>
                <p><strong>Purity:</strong> <span id="product-purity"></span></p>
                <p><strong>Weight:</strong> <span id="product-weight"></span></p>
                <p><strong>Occasion:</strong> <span id="product-occasion"></span></p>
                <h3>Description</h3>
                <p id="product-description"></p>

                <button onclick="enquireWhatsApp()">Enquire on WhatsApp</button>
            </div>

        </div>

        <h2 class="related-heading">You may also like</h2>
        <div id="related-products" class="related-products-grid"></div>

    </section>

    <footer>
        <p>© 2026 K.D JEWELLERY. All Rights Reserved.</p>
    </footer>

    <script src="product.js"></script>

</body>
</html>
